<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Eléctrica RIC</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Calc RIC">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root { --bg: #121826; --card: #1b2438; --accent: #00d2ff; --text: #e0e6ed; --border: #2a364f; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 16px; }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; font-size: 1.4rem; color: var(--accent); }
    .nav { display: flex; gap: 8px; margin-bottom: 16px; }
    .nav button { flex: 1; padding: 10px; background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 6px; cursor: pointer; font-weight: bold; }
    .nav button.active { background: var(--accent); color: #000; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .group { margin-bottom: 12px; }
    label { display: block; font-size: 0.85rem; margin-bottom: 4px; opacity: 0.8; }
    input, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: #0d131f; color: #fff; box-sizing: border-box; font-size: 1rem; }
    .btn-calc { width: 100%; padding: 12px; background: var(--accent); color: #000; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; }
    .result { margin-top: 16px; padding: 12px; background: #0d131f; border-left: 4px solid var(--accent); border-radius: 4px; }
    .badge { font-size: 0.75rem; background: #2a364f; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>

<div class="container">
  <h1>Calculadora Eléctrica <span class="badge" id="ric-version">Cargando...</span></h1>
  
  <div class="nav">
    <button class="active" onclick="switchTab('malla')">Malla a Tierra</button>
    <button onclick="switchTab('conductor')">Conductores MT/AT</button>
  </div>

  <!-- TAB: MALLA A TIERRA -->
  <div id="tab-malla" class="card">
    <h3>Cálculo de Malla a Tierra (Laurent / Niemann)</h3>
    <div class="group">
      <label>Resistividad del Suelo ρ (Ω·m):</label>
      <input type="number" id="rho" value="100">
    </div>
    <div class="group">
      <label>Área de la Malla A (m²):</label>
      <input type="number" id="area" value="100">
    </div>
    <div class="group">
      <label>Largo Total del Conductor L (m):</label>
      <input type="number" id="largo" value="120">
    </div>
    <button class="btn-calc" onclick="calcularMalla()">Calcular Resistencia (Rg)</button>
    <div class="result" id="res-malla">Resultado: --</div>
  </div>

  <!-- TAB: CONDUCTORES -->
  <div id="tab-conductor" class="card" style="display:none;">
    <h3>Sección mínima por Cortocircuito (Adiabático)</h3>
    <div class="group">
      <label>Corriente de Cortocircuito Icc (kA):</label>
      <input type="number" id="icc" value="10">
    </div>
    <div class="group">
      <label>Tiempo de Falla t (segundos):</label>
      <input type="number" id="tiempo" value="0.5" step="0.1">
    </div>
    <div class="group">
      <label>Material Conductor:</label>
      <select id="material">
        <option value="143">Cobre (XLPE/EPR) - k=143</option>
        <option value="94">Aluminio (XLPE/EPR) - k=94</option>
      </select>
    </div>
    <button class="btn-calc" onclick="calcularConductor()">Calcular Sección Mínima</button>
    <div class="result" id="res-conductor">Resultado: --</div>
  </div>
</div>

<script>
  let datosRIC = { version: "RIC V1.0", factorSeguridadMalla: 1.1 };

  document.addEventListener("DOMContentLoaded", function() {
    document.getElementById("ric-version").innerText = datosRIC.version;
  });

  function switchTab(tab) {
    document.getElementById("tab-malla").style.display = (tab === 'malla') ? 'block' : 'none';
    document.getElementById("tab-conductor").style.display = (tab === 'conductor') ? 'block' : 'none';
    
    const buttons = document.querySelectorAll('.nav button');
    buttons[0].classList.toggle('active', tab === 'malla');
    buttons[1].classList.toggle('active', tab === 'conductor');
  }

  function calcularMalla() {
    const rho = parseFloat(document.getElementById("rho").value);
    const A = parseFloat(document.getElementById("area").value);
    const L = parseFloat(document.getElementById("largo").value);

    if(!rho || !A || !L) return;

    const r = Math.sqrt(A / Math.PI);
    const Rg = rho * ((1 / (4 * r)) + (1 / L)) * datosRIC.factorSeguridadMalla;

    document.getElementById("res-malla").innerHTML = 
      `<strong>Resistencia Estimada (Rg):</strong> ${Rg.toFixed(2)} Ω`;
  }

  function calcularConductor() {
    const Icc = parseFloat(document.getElementById("icc").value) * 1000;
    const t = parseFloat(document.getElementById("tiempo").value);
    const k = parseFloat(document.getElementById("material").value);

    if(!Icc || !t || !k) return;

    const S = (Icc * Math.sqrt(t)) / k;

    document.getElementById("res-conductor").innerHTML = 
      `<strong>Sección Mínima Requerida:</strong> ${S.toFixed(2)} mm²`;
  }
</script>

</body>
</html>
