  <title>Calculadora Eléctrica RIC</title>

  <meta name="apple-mobile-web-app-title" content="Calc RIC">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root {
      --bg: #121826;
      --card: #1b2438;
      --accent: #00d2ff;
      --accent-bt: #4caf50;
      --accent-mt: #ff9800;
      --text: #e0e6ed;
      --border: #2a364f;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; font-size: 1.3rem; color: var(--accent); margin-bottom: 12px; }
    
    /* Menú Principal */
    .menu-level { display: flex; gap: 8px; margin-bottom: 12px; }
    .btn-level {
      flex: 1; padding: 12px; border: 2px solid var(--border); background: var(--card);
      color: var(--text); border-radius: 8px; font-weight: bold; font-size: 0.95rem; cursor: pointer; text-align: center;
    }
    .btn-level.active-bt { border-color: var(--accent-bt); background: #1b3323; color: #81c784; }
    .btn-level.active-mt { border-color: var(--accent-mt); background: #3b2814; color: #ffb74d; }

    /* Submenú */
    .subnav { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
    .subnav button {
      flex: 1; min-width: 100px; padding: 8px; background: #0d131f; border: 1px solid var(--border);
      color: var(--text); border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 500;
    }
    .subnav button.active { background: var(--accent); color: #000; font-weight: bold; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .section-title {
      font-size: 1rem; color: var(--accent); border-bottom: 1px solid var(--border);
      padding-bottom: 6px; margin-top: 16px; margin-bottom: 12px; font-weight: bold;
    }
